<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Product</title>
</head>
<body>
<h1>Add New Product</h1>

<form th:action="@{/products}" th:object="${product}" method="post">
    <p>
        Name:<br>
        <input type="text" th:field="*{name}">
        <span style="color:red" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
    </p>
    <p>
        Category:<br>
        <input type="text" th:field="*{category}">
        <span style="color:red" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></span>
    </p>
    <p>
        Price:<br>
        <input type="number" step="0.01" th:field="*{price}">
        <span style="color:red" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
    </p>
    <p>
        Quantity:<br>
        <input type="number" th:field="*{quantity}">
        <span style="color:red" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></span>
    </p>
    <p>
        Supplier:<br>
        <select name="supplier.id" required>
            <option value="">-- Select supplier --</option>
            <option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.name}"
                    th:selected="${product.supplier != null and product.supplier.id == s.id}"></option>
        </select>
    </p>
    <button type="submit">Save Product</button>
</form>

<br>
<a href="/products">Back to Products</a>
</body>
</html>
