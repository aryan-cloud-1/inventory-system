<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Add Product')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container" style="max-width: 600px">
    <h1 class="mb-4">Add New Product</h1>

    <form th:action="@{/products}" th:object="${product}" method="post">
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" th:field="*{name}" class="form-control" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Category</label>
            <input type="text" th:field="*{category}" class="form-control" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{category}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Price</label>
            <input type="number" step="0.01" th:field="*{price}" class="form-control" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{price}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Quantity</label>
            <input type="number" th:field="*{quantity}" class="form-control" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{quantity}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Supplier</label>
            <select name="supplier.id" class="form-select" required>
                <option value="">-- Select supplier --</option>
                <option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.name}"
                        th:selected="${product.supplier != null and product.supplier.id == s.id}"></option>
            </select>
        </div>

        <button type="submit" class="btn btn-success">Save Product</button>
        <a href="/products" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
