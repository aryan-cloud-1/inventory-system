<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Stock History')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container">
    <h1 class="mb-4">Stock History</h1>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr>
            <th>Date</th>
            <th>Product</th>
            <th>Type</th>
            <th>Change</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="t : ${transactions}">
            <td th:text="${#temporals.format(t.transactionDate, 'dd-MM-yyyy HH:mm')}"></td>
            <td th:text="${t.product?.name}"></td>
            <td th:text="${t.transactionType}"></td>
            <td th:text="${t.quantityChange}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
